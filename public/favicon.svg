<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="pv-title pv-desc">
  <title id="pv-title">PipeViz</title>
  <desc id="pv-desc">Three pipeline lanes merging into one flow ending in an arrow.</desc>
  <defs>
    <linearGradient id="pv-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pv-lane" x1="80" y1="256" x2="360" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#pv-bg)"/>

  <!-- three input lanes -->
  <g fill="none" stroke="url(#pv-lane)" stroke-width="42" stroke-linecap="round">
    <path d="M126 150 H288 Q336 150 336 198 V226"/>
    <path d="M126 256 H336"/>
    <path d="M126 362 H288 Q336 362 336 314 V286"/>
  </g>

  <!-- lane origin dots -->
  <g fill="#7dd3fc">
    <circle cx="112" cy="150" r="26"/>
    <circle cx="112" cy="256" r="26"/>
    <circle cx="112" cy="362" r="26"/>
  </g>

  <!-- merge junction -->
  <circle cx="340" cy="256" r="34" fill="#f1f5f9"/>

  <!-- trunk and arrowhead -->
  <path d="M340 256 H402" fill="none" stroke="#f1f5f9" stroke-width="40" stroke-linecap="round"/>
  <path d="M398 208 L474 256 L398 304 Z" fill="#f1f5f9"/>
</svg>
