<!doctype html>
<!-- HTML5 doctype: standards mode for consistent CSS behavior. -->
<html lang="en">
  <head>
    <!-- Charset first so the parser switches encoding before reading anything else. -->
    <meta charset="UTF-8" />
    <!-- Viewport keeps rendering crisp; mobile is a non-goal (plan NG5) but this costs nothing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Dark UI by default (plan section 10; light joined as an M6 opt-in).
         Both schemes are declared so the browser knows the app supports
         theming, and the inline script below applies a saved choice before
         first paint - without it, light-mode users would see one dark flash. -->
    <meta name="color-scheme" content="dark light" />
    <!-- Browser chrome color on mobile OSes; mirrors the background token in global.css.
         The pre-paint script keeps this in step with the saved theme. -->
    <meta name="theme-color" content="#0f172a" />
    <script>
      try {
        if (localStorage.getItem('pipeviz-theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#e7edf5')
        }
      } catch (e) {
        /* private mode: storage throws, defaults apply */
      }
    </script>
    <!-- One-line pitch reused by search engines and link unfurlers. -->
    <meta
      name="description"
      content="PipeViz turns Jenkins pipeline definitions into an interactive graph. Runs entirely in your browser; no backend, no uploads."
    />
    <!-- SVG favicon served from public/ (same art as logo.svg). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Tab title; wordmark plus pitch keeps it readable when truncated. -->
    <title>PipeViz · Jenkinsfile to graph</title>
  </head>
  <body>
    <!-- React mounts the entire application into this single element. -->
    <div id="root"></div>
    <!-- Entry module loaded as ESM; Vite injects CSS imports and HMR from here. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
